# How each portrait is cropped. One line per image that needs it — most need none.
#
#   <slug> <focus> <zoom>
#
# focus  vertical CENTRE of the square crop: 0 = top edge, 1 = bottom edge (default 0.30)
# zoom   how tight: 1 = the largest square that fits, higher crops in (default 1.7)
#
# Already cropped the image to a square yourself? Add "<slug> 0.5 1" so the HUD uses
# all of it instead of cropping in again.
#
# The crop is always horizontally centred and cannot be panned — if the face sits left
# or right of centre, crop the image itself.
#
# Try numbers before committing to them:
#   bin/claude-hud --preview /tmp/try.png --member <slug> \
#     --avatar-focus 0.02 --avatar-zoom 1.45 --title t --body b
chaeyoung 0.02 1.45
